<!DOCTYPE HTML>
<html lang="hu" xmlns:th="http://thymeleaf.org">
<head>
	<th:block th:replace="~{/fragments/head}"></th:block>
	<link rel="stylesheet" th:href="@{/assets/css/main-extended.css}" />
</head>
<body class="is-preload">

<div id="wrapper">
	<div id="main">
		<div class="inner">
			<th:block th:replace="~{/fragments/header}"></th:block>
			<section>
				<div class="content">
					<div class="major">
						<h2>Történelmi árak</h2>
					</div>
					<hr/>
					<form method="post" class="form-container" th:object="${histForm}">
						<div class="row">
							<div class="col-4">
								<select th:field="*{instrument}">
									<option value="" selected disabled hidden>Válasszon devizát...</option>
									<option th:value="${i}" th:each="i:${instruments}" th:text="${i}"></option>
								</select>
							</div>
							<div class="col-4">
								<select th:field="*{granularity}">
									<option value="M1">M1</option>
									<option value="H1">H1</option>
									<option value="D">D</option>
									<option value="W">W</option>
									<option value="M">M</option>
								</select>
							</div>
							<div class="col-4">
								<input type="submit" value="Küldés">
							</div>
						</div>
					</form>
					<hr/>
					<th:block th:if="${renderTable}">
						<div class="row aln-center">
							<div class="col-12">
								<h3>Eredmények (<span th:text="${histForm.instrument}"></span> - <span th:text="${histForm.granularity}"></span>)</h3>
								<table>
									<thead>
									<tr>
										<th>Időpont</th>
										<th class="align-right">Záró ár</th>
									</tr>
									</thead>
									<tbody>
									<tr th:each="candle : ${candles}">
										<td th:text="${candle.time}"></td>
										<td class="align-right" th:text="${candle.closePrice}"></td>
									</tr>
									</tbody>
								</table>
							</div>
						</div>
						<hr/>
					</th:block>
				</div>
				<th:block th:replace="~{/fragments/back_to_main}"></th:block>
			</section>
		</div>
	</div>
	<th:block th:replace="~{/fragments/sidebar}"></th:block>
</div>
<th:block th:replace="~{/fragments/scripts}"></th:block>
</body>
</html>
