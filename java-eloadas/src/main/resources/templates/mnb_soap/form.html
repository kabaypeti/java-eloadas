<!DOCTYPE html>
<html lang="en">
<head>
    <th:block th:replace="~{/fragments/head}"></th:block>
    <link rel="stylesheet" th:href="@{/assets/css/main-extended.css}" />
</head>
<body class="is-preload">

<!-- Wrapper -->
<div id="wrapper">

    <!-- Main -->
    <div id="main">
        <div class="inner">

            <th:block th:replace="~{/fragments/header}"></th:block>

            <section>
                <div class="content">
                    <header>
                        <h2>Adatok megadása</h2>
                    </header>
                    <form action="#" th:action="@{/mnbsoap}" th:object="${price}" method="post" class="form-container">
                        <div class="row">
                            <div class="col-3">
                                <label for="currencies">Válasszon kezdő dátumot:</label>
                            </div>
                            <div class="col-6">
                                <select id="currencies" name="currencies" th:field="*{currency}" required>
                                    <option value="EUR">EUR</option>
                                    <option value="USD">USD</option>
                                    <option value="GBP">GBP</option>
                                    <option value="JPY">JPY</option>
                                </select>
                            </div>
                        </div>
                        <div class="row">
                            <div class="col-3">
                                <label for="startDate">Válasszon kezdő dátumot:</label>
                            </div>
                            <div class="col-6">
                                <input id="startDate" type="date" th:field="*{startDate}" required>
                            </div>
                        </div>

                        <div class="row">
                            <div class="col-3">
                                <label for="endDate">Válasszon befejező dátumot:</label>
                            </div>
                            <div class="col-6">
                                <input id="endDate" type="date" th:field="*{endDate}" required>
                            </div>
                        </div>
                        <input type="submit" value="Küldés" class="primary-button">
                    </form>
                </div>
            </section>

        </div>
    </div>
    <th:block th:replace="~{/fragments/sidebar}"></th:block>
</div>
<th:block th:replace="~{/fragments/scripts}"></th:block>
</body>
</html>
