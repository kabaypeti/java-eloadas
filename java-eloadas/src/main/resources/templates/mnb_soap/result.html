<!DOCTYPE html>
<html lang="en">
<head>
    <th:block th:replace="~{/fragments/head}"></th:block>
    <link rel="stylesheet" th:href="@{/assets/css/main-extended.css}" />
</head>
<body class="is-preload">
<script th:src="@{/assets/node/node_modules/chart.js/dist/chart.umd.js}"></script>
<div id="wrapper">
    <div id="main">
        <div class="inner">

            <th:block th:replace="~{/fragments/header}"></th:block>

            <section>
                <div class="content">
                    <h2>Historical prices:</h2>
                    <div>
                        <canvas id="chartoutput" th:attr="data=${output}"></canvas>
                    </div>
                    <hr/>
                    <a th:href="@{/mnbsoap}" class="link-button"><input type="submit" value="Vissza az űrlaphoz" class="primary-button"></a>
                    <hr/>
                    <div id="textoutput">
                        <table>
                            <tr>
                                <td>Date</td>
                                <td>Unit</td>
                                <td>Currency</td>
                                <td>Exchange Rate</td>
                            </tr>
                            <tr th:each="day,iStat:${output}" th:if="${day.rate} != null">
                                <td th:text="${day.date}"></td>
                                <td th:text="${day.rate.unit}"></td>
                                <td th:text="${day.rate.currency}"></td>
                                <td th:text="${day.rate.rate}"></td>
                            </tr>
                        </table>
                    </div>

                </div>
            </section>

        </div>
    </div>
    <th:block th:replace="~{/fragments/sidebar}"></th:block>
</div>
<th:block th:replace="~{/fragments/scripts}"></th:block>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chart.js/dist/chart.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/chartjs-adapter-date-fns/dist/chartjs-adapter-date-fns.bundle.min.js"></script>

<script th:inline="javascript" type="text/javascript">
    /*<![CDATA[*/
    var realdata = /*[[${output}]]*/
        realdata = realdata.filter(x => x.rate != null)

    new Chart(
        document.getElementById('chartoutput'),
        {
            type: 'line',
            data: {
                labels: realdata.map(row => row.date),
                datasets: [
                    {
                        label: 'Exchange rate',
                        data: realdata.map(row => parseFloat(row.rate.rate)),
                        borderColor: 'rgb(57, 217, 4)',
                        fill: {
                            target: 'origin',
                            above: 'rgba(57, 217, 4, 0.4)'
                        },
                        pointStyle: false
                    }
                ]
            },
            options: {
                scales: {
                    x: {
                        type: 'time',
                        time: {
                            tooltipFormat: 'dd MMM yyyy',
                            unit: 'month',
                            displayFormats: {
                                quarter: 'MMM YYYY'
                            }
                        },
                        title: {
                            display: true,
                            text: 'Date'
                        }
                    }
                }
            }
        }
    )
    /*]]>*/
</script>
</body>
</html>
